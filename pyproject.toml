[project]
name = "polyalgotrade"
version = "0.0.0"
description = "Prediction-market algorithmic trading research framework (Polymarket / Kalshi)"
readme = "README.md"
requires-python = ">=3.11"
# Runtime deps. polymarket-client (py-sdk, beta, ADR 0008) is added at Phase 3 (live), not now.
dependencies = [
    "httpx[http2]>=0.27",
    "websockets>=12",
    "pydantic>=2.7",
    "polars>=1.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pat"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]  # incl. flake8-bandit (S) for secrets/safety

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]   # assert + domain kwargs that look like passwords (token_id, etc.)
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
