[project]
name = "polyalgotrade"
version = "0.0.0"
description = "Prediction-market algorithmic trading research framework (Polymarket / Kalshi)"
readme = "README.md"
requires-python = ">=3.11"
# Runtime deps. polymarket-client (py-sdk, beta, ADR 0008) is added at Phase 3 (live), not now.
dependencies = [
    "httpx[http2]>=0.27",
    "websockets>=12",
    "pydantic>=2.7",
    "polars>=1.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pat"]

[tool.uv]
# Supply-chain hardening (ADR 0017): rolling dependency cooldown. Refuse to resolve any
# package version published in the last 7 days. Most malicious PyPI/npm releases are caught
# and yanked within hours-to-days (axios ~4h, Solana web3.js ~5h; 8/10 major attacks had a
# <1-week window), so a 7-day window dodges the live-attack window at resolution time.
# Urgent security hotfix inside the window: `uv lock --exclude-newer-package <pkg>=<timestamp>`.
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]  # incl. flake8-bandit (S) for secrets/safety

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # assert + hardcoded-password false positives on token_id strings
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
